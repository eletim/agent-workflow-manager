name: tmp-sidebar-running-width

on:
  push:
    branches:
      - feature/sidebar-running-run-width

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group test --group lint
      - run: node --test tests/test_app.js
      - run: uv run pytest tests/test_runner_ui.py
      - run: uv run pytest tests/test_http_browser.py -k "runner_is_usable_at_mobile_and_desktop_viewports"
      - run: uv run ruff check tests/test_runner_ui.py tests/test_http_browser.py

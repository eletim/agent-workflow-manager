name: tmp-resume-regenerate

on:
  push:
    branches:
      - feature/resume-regenerate-current-workflow

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group test --group lint
      - name: Provide PurpleMux preflight stub
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/bin/purplemux"
          chmod +x "$RUNNER_TEMP/bin/purplemux"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv run pytest tests/test_runner.py -k "resume"
      - run: uv run pytest tests/test_http_browser.py -k "issue_driven_story_survives_failure_recovery_and_browser_reload"
      - run: uv run ruff check src/purplemux_client/runner.py tests/test_runner.py tests/test_http_browser.py

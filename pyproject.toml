[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purplemux-client"
version = "0.1.0"
description = "PurpleMux CLI adapter and trusted local Python runner UI."
authors = []
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = []

[dependency-groups]
test = [
    "pytest",
    "selenium",
]
lint = [
    "ruff",
    "ty",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.hatch.build.targets.wheel]
packages = ["src/purplemux_client"]

[tool.hatch.build.targets.wheel.force-include]
"examples/sequential-version-development.py" = "purplemux_client/_issue_driven_sequential_template.py"

[tool.ruff]
lint.select = ["E", "F", "I", "RUF100", "UP"]
lint.ignore = ["E501"]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5 -vv"
markers = [
    "live: requires local authenticated Codex and PurpleMux services",
]

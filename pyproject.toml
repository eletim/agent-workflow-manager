[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "purplemux-client"
version = "0.1.0"
description = "Lightweight runner and manager for AI-generated Python and Bash workflows."
authors = []
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
dependencies = []

[dependency-groups]
test = [
    "pytest",
]
lint = [
    "ruff",
    "ty",
]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]

[tool.hatch.build.targets.wheel]
packages = ["src/purplemux_client"]

[tool.ruff]
lint.select = ["E", "F", "I", "RUF100", "UP"]
lint.ignore = ["E501"]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5 -vv"
